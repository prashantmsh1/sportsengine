<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Websocket Chat</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet" />
        <style>
            :root {
                --primary-color: #4f46e5;
                --primary-hover: #4338ca;
                --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                --chat-bg: #ffffff;
                --sent-bg: #4f46e5;
                --sent-text: #ffffff;
                --received-bg: #f3f4f6;
                --received-text: #1f2937;
            }

            body {
                font-family: "Inter", sans-serif;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background: var(--bg-gradient);
                color: #333;
            }

            .chat-container {
                width: 100%;
                max-width: 480px;
                height: 80vh;
                background: var(--chat-bg);
                border-radius: 20px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .chat-header {
                padding: 1.5rem;
                background: #fff;
                border-bottom: 1px solid #e5e7eb;
                text-align: center;
            }

            .chat-header h1 {
                margin: 0;
                font-size: 1.25rem;
                font-weight: 600;
                color: #111827;
            }

            .status {
                font-size: 0.875rem;
                color: #10b981;
                margin-top: 0.25rem;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
            }

            .status-dot {
                width: 8px;
                height: 8px;
                background: #10b981;
                border-radius: 50%;
            }

            .status.disconnected {
                color: #ef4444;
            }
            .status.disconnected .status-dot {
                background: #ef4444;
            }

            #messages {
                flex: 1;
                padding: 1.5rem;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                background: #fff;
            }

            .message {
                max-width: 75%;
                padding: 0.75rem 1rem;
                border-radius: 1rem;
                font-size: 0.9375rem;
                line-height: 1.4;
                position: relative;
                animation: fadeIn 0.3s ease;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .message.sent {
                align-self: flex-end;
                background: var(--sent-bg);
                color: var(--sent-text);
                border-bottom-right-radius: 0.25rem;
            }

            .message.received {
                align-self: flex-start;
                background: var(--received-bg);
                color: var(--received-text);
                border-bottom-left-radius: 0.25rem;
            }

            .input-area {
                padding: 1.25rem;
                background: #fff;
                border-top: 1px solid #e5e7eb;
                display: flex;
                gap: 0.75rem;
            }

            input[type="text"] {
                flex: 1;
                padding: 0.875rem 1rem;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem;
                font-family: inherit;
                font-size: 0.9375rem;
                outline: none;
                transition: border-color 0.2s;
            }

            input[type="text"]:focus {
                border-color: var(--primary-color);
            }

            button {
                background: var(--primary-color);
                color: white;
                border: none;
                padding: 0 1.5rem;
                border-radius: 0.75rem;
                font-weight: 500;
                font-family: inherit;
                cursor: pointer;
                transition:
                    background 0.2s,
                    transform 0.1s;
            }

            button:hover {
                background: var(--primary-hover);
            }

            button:active {
                transform: scale(0.98);
            }

            /* Scrollbar Styling */
            #messages::-webkit-scrollbar {
                width: 6px;
            }
            #messages::-webkit-scrollbar-track {
                background: transparent;
            }
            #messages::-webkit-scrollbar-thumb {
                background: #d1d5db;
                border-radius: 3px;
            }
        </style>
    </head>
    <body>
        <div class="chat-container">
            <div class="chat-header">
                <h1>SportsEngine Chat</h1>
                <div class="status" id="status-indicator">
                    <div class="status-dot"></div>
                    <span>Connected</span>
                </div>
            </div>
            <div id="messages"></div>
            <div class="input-area">
                <input
                    type="text"
                    id="message"
                    placeholder="Type a message..."
                    onkeypress="handleKeyPress(event)" />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <script>
            const socket = new WebSocket("ws://localhost:8080");
            const statusEl = document.getElementById("status-indicator");
            const statusText = statusEl.querySelector("span");

            socket.addEventListener("open", () => {
                console.log("Connected to server");
                statusText.textContent = "Connected";
                statusEl.classList.remove("disconnected");
            });

            socket.addEventListener("message", (event) => {
                console.log(`Received: ${event.data}`);
                if (event.data instanceof Blob) {
                    const reader = new FileReader();
                    reader.onload = () => {
                        addMessage(reader.result, "received");
                    };
                    reader.readAsText(event.data);
                } else {
                    addMessage(event.data, "received");
                }
            });

            socket.addEventListener("close", () => {
                console.log("Disconnected from server");
                statusText.textContent = "Disconnected";
                statusEl.classList.add("disconnected");
            });

            socket.addEventListener("error", (error) => {
                console.log(`Error: ${error.message}`);
            });

            function handleKeyPress(event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            }

            function sendMessage() {
                const input = document.getElementById("message");
                const message = input.value.trim();
                if (message) {
                    socket.send(message);
                    input.value = "";
                    addMessage(message, "sent");
                }
            }

            function addMessage(message, type) {
                const messages = document.getElementById("messages");
                const messageElement = document.createElement("div");
                const rootMessageElement = document.createElement("div");
                rootMessageElement.className = `message ${type}`;
                const dateElement = document.createElement("div");
                dateElement.textContent = new Date().toLocaleString();
                messageElement.textContent = message;

                rootMessageElement.appendChild(dateElement);
                rootMessageElement.appendChild(messageElement);
                messages.appendChild(rootMessageElement);

                // Scroll to bottom
                messages.scrollTop = messages.scrollHeight;
            }
        </script>
    </body>
</html>
